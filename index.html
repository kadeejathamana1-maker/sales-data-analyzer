<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Data Analyzer</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5fa;
            margin: 0;
            padding: 20px;
            color: #263449;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1, .subtitle {
            text-align: center;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 25px 0;
        }

        .card, .chart-box, .table-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #0000000d;
        }

        .card h3 {
            color: #63738a;
            font-size: 15px;
        }

        .value {
            font-size: 24px;
            font-weight: bold;
            color: #2563eb;
        }

        h2 {
            font-size: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #eff4ff;
        }

        .chart-box, .table-box {
            margin-bottom: 20px;
        }

        footer {
            text-align: center;
            color: #63738a;
            margin-top: 25px;
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>Sales Data Analyzer</h1>
        <p class="subtitle">
            A simple dashboard to understand sales performance
        </p>

        <div class="cards">
            <div class="card">
                <h3>Total Revenue</h3>
                <div class="value" id="revenue">₹0</div>
            </div>

            <div class="card">
                <h3>Average Sales</h3>
                <div class="value" id="average">₹0</div>
            </div>

            <div class="card">
                <h3>Best-Selling Product</h3>
                <div class="value" id="bestProduct">-</div>
            </div>
        </div>

        <div class="chart-box">
            <h2>Sales Revenue by Product</h2>
            <canvas id="salesChart"></canvas>
        </div>

        <div class="table-box">
            <h2>Sales Details</h2>

            <table>
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Quantity</th>
                        <th>Price</th>
                        <th>Total Sales</th>
                    </tr>
                </thead>

                <tbody id="salesTable"></tbody>
            </table>
        </div>

        <footer>
            Created using HTML, CSS and JavaScript
        </footer>

    </div>

    <script>
        const sales = [
            { product: "Laptop", quantity: 5, price: 50000 },
            { product: "Phone", quantity: 10, price: 20000 },
            { product: "Tablet", quantity: 8, price: 15000 },
            { product: "Laptop", quantity: 3, price: 50000 },
            { product: "Phone", quantity: 7, price: 20000 },
            { product: "Tablet", quantity: 6, price: 15000 }
        ];

        const productRevenue = {};
        const productQuantity = {};
        let totalRevenue = 0;

        const table = document.getElementById("salesTable");

        sales.forEach(item => {
            const total = item.quantity * item.price;
            totalRevenue += total;

            productRevenue[item.product] =
                (productRevenue[item.product] || 0) + total;

            productQuantity[item.product] =
                (productQuantity[item.product] || 0) + item.quantity;

            table.innerHTML += `
                <tr>
                    <td>${item.product}</td>
                    <td>${item.quantity}</td>
                    <td>₹${item.price.toLocaleString("en-IN")}</td>
                    <td>₹${total.toLocaleString("en-IN")}</td>
                </tr>
            `;
        });

        const averageSales = totalRevenue / sales.length;

        const bestProduct = Object.keys(productQuantity).reduce(
            (best, product) =>
                productQuantity[product] > productQuantity[best]
                    ? product : best
        );

        document.getElementById("revenue").textContent =
            "₹" + totalRevenue.toLocaleString("en-IN");

        document.getElementById("average").textContent =
            "₹" + averageSales.toLocaleString("en-IN", {
                maximumFractionDigits: 2
            });

        document.getElementById("bestProduct").textContent =
            bestProduct;

        new Chart(document.getElementById("salesChart"), {
            type: "bar",
            data: {
                labels: Object.keys(productRevenue),
                datasets: [{
                    label: "Total Revenue (₹)",
                    data: Object.values(productRevenue),
                    backgroundColor: ["#3b82f6", "#14b8a6", "#f59e0b"]
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    </script>
</body>
</html>
